openapi: 3.1.0
info:
  title: Teacher GPT Locator API
  version: 3.0.0
  description: Returns strict page-by-page retrieval plans for one indexed textbook.
servers:
  - url: https://YOUR_DOMAIN
paths:
  /health:
    get:
      operationId: healthCheck
      summary: Check the loaded Version 3 locator index.
      responses:
        '200':
          description: Locator index is loaded and complete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /gpt/section-locators/{section_id}:
    get:
      operationId: gptGetSectionLocator
      summary: Get the complete page-by-page retrieval plan for an exact section ID.
      parameters:
        - name: section_id
          in: path
          required: true
          description: Exact printed section or generated learning-unit ID, such as 2.6 or 2.6.5.1.
          schema:
            type: string
            pattern: '^\d+(?:\.\d+)*$'
      responses:
        '200':
          description: Strict Version 3 section locator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionLocator'
        '404':
          description: The exact section ID does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, data_version, book_id, section_count, page_count]
      properties:
        status:
          type: string
          const: ok
        data_version:
          type: string
          const: '3'
        book_id:
          type: string
        section_count:
          type: integer
          minimum: 1
        page_count:
          type: integer
          minimum: 1
    PageReference:
      type: object
      additionalProperties: false
      required: [pdf_page_index, pdf_page_number, printed_page_label]
      properties:
        pdf_page_index:
          type: integer
          minimum: 0
        pdf_page_number:
          type: integer
          minimum: 1
        printed_page_label:
          type: string
          minLength: 1
    PageRange:
      type: object
      additionalProperties: false
      required:
        - pdf_page_index_start
        - pdf_page_index_end
        - pdf_page_number_start
        - pdf_page_number_end
        - printed_page_start
        - printed_page_end
      properties:
        pdf_page_index_start:
          type: integer
          minimum: 0
        pdf_page_index_end:
          type: integer
          minimum: 0
        pdf_page_number_start:
          type: integer
          minimum: 1
        pdf_page_number_end:
          type: integer
          minimum: 1
        printed_page_start:
          type: string
        printed_page_end:
          type: string
    HeadingLocation:
      type: object
      additionalProperties: false
      required: [page, bbox]
      properties:
        page:
          $ref: '#/components/schemas/PageReference'
        bbox:
          type: array
          minItems: 4
          maxItems: 4
          prefixItems:
            - {type: number}
            - {type: number}
            - {type: number}
            - {type: number}
    BoundaryAnchor:
      type: object
      additionalProperties: false
      required: [kind, value]
      properties:
        kind:
          type: string
          enum: [heading, figure, equation, example, table, text]
        value:
          type: string
          minLength: 1
    ContentWindow:
      type: object
      additionalProperties: false
      required: [start_at, end_before]
      properties:
        start_at:
          anyOf:
            - $ref: '#/components/schemas/BoundaryAnchor'
            - type: 'null'
        end_before:
          anyOf:
            - $ref: '#/components/schemas/BoundaryAnchor'
            - type: 'null'
    EvidenceRequirement:
      type: object
      additionalProperties: false
      required: [kind, value, verification_mode]
      properties:
        kind:
          type: string
          enum:
            - printed_page_equals
            - contains_heading
            - contains_figure
            - contains_equation
            - contains_example
            - contains_table
            - contains_text
            - running_header_contains
        value:
          type: string
          minLength: 1
        verification_mode:
          type: string
          enum: [visual_required, text_or_visual]
    PageCoverage:
      type: object
      additionalProperties: false
      required: [subheadings, figure_ids, equation_ids, example_ids, table_ids]
      properties:
        subheadings:
          type: array
          items: {type: string}
        figure_ids:
          type: array
          items: {type: string}
        equation_ids:
          type: array
          items: {type: string}
        example_ids:
          type: array
          items: {type: string}
        table_ids:
          type: array
          items: {type: string}
    PageRetrievalStep:
      type: object
      additionalProperties: false
      required:
        - sequence
        - page_role
        - page
        - content_window
        - queries
        - required_evidence
        - coverage
      properties:
        sequence:
          type: integer
          minimum: 1
        page_role:
          type: string
          enum: [start, body, end, single]
        page:
          $ref: '#/components/schemas/PageReference'
        content_window:
          $ref: '#/components/schemas/ContentWindow'
        queries:
          type: array
          minItems: 2
          maxItems: 4
          items:
            type: string
        required_evidence:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/EvidenceRequirement'
        coverage:
          $ref: '#/components/schemas/PageCoverage'
    SectionLocator:
      type: object
      additionalProperties: false
      required:
        - data_version
        - book_id
        - section_kind
        - section_id
        - printed_section_id
        - parent_section_id
        - title
        - source_heading
        - source_heading_numbered
        - source_location
        - source_level
        - hierarchy_depth
        - page_range
        - outline
        - retrieval_plan
      properties:
        data_version:
          type: string
          const: '3'
        book_id:
          type: string
        section_kind:
          type: string
          enum: [printed, learning_unit]
        section_id:
          type: string
          pattern: '^\d+(?:\.\d+)*$'
        printed_section_id:
          type: string
          pattern: '^\d+(?:\.\d+)*$'
        parent_section_id:
          anyOf:
            - type: string
              pattern: '^\d+(?:\.\d+)*$'
            - type: 'null'
        title:
          type: string
        source_heading:
          type: string
        source_heading_numbered:
          type: boolean
        source_location:
          $ref: '#/components/schemas/HeadingLocation'
        source_level:
          type: integer
          minimum: 0
        hierarchy_depth:
          type: integer
          minimum: 1
        page_range:
          $ref: '#/components/schemas/PageRange'
        outline:
          type: array
          items: {type: string}
        retrieval_plan:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PageRetrievalStep'
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error_code, detail]
      properties:
        error_code:
          type: string
          const: SECTION_NOT_FOUND
        detail:
          type: string
