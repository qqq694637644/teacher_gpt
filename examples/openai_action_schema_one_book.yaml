{
  "openapi": "3.1.0",
  "info": {
    "title": "Teacher GPT Locator API",
    "description": "Strict one-book GPT Action API. It returns page-by-page retrieval plans for the original PDF and never returns textbook content.",
    "version": "3.1.0"
  },
  "paths": {
    "/gpt/section-locators/{section_id}": {
      "get": {
        "tags": [
          "gpt"
        ],
        "summary": "Get Section Locator",
        "operationId": "gptGetSectionLocator",
        "parameters": [
          {
            "name": "section_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "title": "Section Id"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SectionLocator"
                }
              }
            }
          },
          "404": {
            "description": "Section id does not exist.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SectionNotFoundResponse"
                }
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    },
    "/gpt/exercise-locators/{exercise_id}": {
      "get": {
        "tags": [
          "gpt"
        ],
        "summary": "Get Exercise Locator",
        "operationId": "gptGetExerciseLocator",
        "parameters": [
          {
            "name": "exercise_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^\\d+\\.\\d+$",
              "title": "Exercise Id"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ExerciseLocator"
                }
              }
            }
          },
          "404": {
            "description": "Exercise id does not exist.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ExerciseNotFoundResponse"
                }
              }
            }
          },
          "503": {
            "description": "Exercise catalog has not been configured.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ExerciseCatalogUnavailableResponse"
                }
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    },
    "/gpt/chapters/{chapter_id}/exercises": {
      "get": {
        "tags": [
          "gpt"
        ],
        "summary": "List Chapter Exercises",
        "operationId": "gptListChapterExercises",
        "parameters": [
          {
            "name": "chapter_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^\\d+$",
              "title": "Chapter Id"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ChapterExerciseSummary"
                }
              }
            }
          },
          "404": {
            "description": "Chapter has no exercise catalog entry.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ExerciseNotFoundResponse"
                }
              }
            }
          },
          "503": {
            "description": "Exercise catalog has not been configured.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ExerciseCatalogUnavailableResponse"
                }
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    },
    "/v1/skills/load": {
      "post": {
        "summary": "Load selected Skills.",
        "description": "Load complete SKILL.md files after the prompt catalog selects matching ids. Returns each Skill body, content hash, and referenced_paths for optional follow-up.",
        "operationId": "loadSkills",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/LoadSkillsRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/LoadSkillsResponse"
                }
              }
            }
          },
          "404": {
            "description": "Not Found",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/StructuredErrorResponse"
                }
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        },
        "x-openai-isConsequential": false
      }
    },
    "/v1/skills/read": {
      "post": {
        "summary": "Read a referenced file from a selected Skill.",
        "description": "Read an exact referenced path from a loaded Skill. Returns bounded content, hash, truncated, and next_start_line for continuation.",
        "operationId": "readSkillContent",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ReadSkillContentRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ReadSkillContentResponse"
                }
              }
            }
          },
          "404": {
            "description": "Not Found",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/StructuredErrorResponse"
                }
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        },
        "x-openai-isConsequential": false
      }
    },
    "/v1/workspace/prepare": {
      "post": {
        "summary": "Create or reuse a persistent workspace.",
        "description": "Create an empty persistent workspace or reuse an existing workspace_id. Returns workspace_id plus created/empty; repo and branch state remain unmanaged.",
        "operationId": "prepareWorkspace",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/PrepareWorkspaceRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PrepareWorkspaceResponse"
                }
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        },
        "x-openai-isConsequential": false
      }
    },
    "/v1/workspace/command": {
      "post": {
        "summary": "Start or manage a PowerShell workspace command.",
        "description": "Run PowerShell 7 work. start returns output if the command finishes quickly; when it returns a running operation_id, follow with get/logs until a terminal state.",
        "operationId": "workspaceCommand",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/WorkspaceCommandRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/WorkspaceCommandResponse"
                }
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        },
        "x-openai-isConsequential": false
      }
    },
    "/v1/workspace/inspect": {
      "post": {
        "summary": "Discover an unfamiliar workspace before choosing exact paths.",
        "description": "First pass for unfamiliar paths. Returns a bounded tree plus optional literal search matches and matching file snippets; truncated means discovery is incomplete.",
        "operationId": "workspaceInspect",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/WorkspaceInspectRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/WorkspaceInspectResponse"
                }
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        },
        "x-openai-isConsequential": false
      }
    },
    "/v1/workspace/search": {
      "post": {
        "summary": "Locate code and text in known workspace paths with ripgrep.",
        "description": "Primary locator when the exact file or impact location is unknown, or when tracing references. Returns path/line/snippet matches; truncated means results are incomplete.",
        "operationId": "workspaceSearch",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/WorkspaceSearchRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/WorkspaceSearchResponse"
                }
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        },
        "x-openai-isConsequential": false
      }
    },
    "/v1/workspace/read-files": {
      "post": {
        "summary": "Read selected UTF-8 files after their exact paths are known.",
        "description": "Read bounded content from exact known files. Returns numbered content, hashes, and next_start_line when a file is truncated; use inspect/search for discovery.",
        "operationId": "workspaceReadFiles",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/WorkspaceReadFilesRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/WorkspaceReadFilesResponse"
                }
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        },
        "x-openai-isConsequential": false
      }
    },
    "/v1/workspace/write-file": {
      "post": {
        "summary": "Write one UTF-8 text file.",
        "description": "Create or replace one known text file in the workspace. Returns hashes, changed_files, and diff_stat; this does not commit or publish changes.",
        "operationId": "workspaceWriteFile",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/WorkspaceWriteFileRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/WorkspaceWriteFileResponse"
                }
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        },
        "x-openai-isConsequential": false
      }
    },
    "/v1/workspace/apply-patch": {
      "post": {
        "summary": "Apply a controlled Codex text patch.",
        "description": "Apply a multi-file text patch with dry-run and rollback on failure. Returns changed_files and diff_stat; this does not commit or publish changes.",
        "operationId": "workspaceApplyPatch",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/WorkspaceApplyPatchRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/WorkspaceApplyPatchResponse"
                }
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        },
        "x-openai-isConsequential": false
      }
    }
  },
  "components": {
    "schemas": {
      "BoundaryAnchor": {
        "properties": {
          "kind": {
            "type": "string",
            "enum": [
              "heading",
              "figure",
              "equation",
              "example",
              "table",
              "text",
              "exercise"
            ],
            "title": "Kind"
          },
          "value": {
            "type": "string",
            "minLength": 1,
            "title": "Value"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "kind",
          "value"
        ],
        "title": "BoundaryAnchor"
      },
      "ChangedFile": {
        "properties": {
          "path": {
            "type": "string",
            "title": "Path"
          },
          "operation": {
            "type": "string",
            "title": "Operation"
          },
          "status": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Status"
          },
          "previous_path": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Previous Path"
          },
          "additions": {
            "type": "integer",
            "title": "Additions",
            "default": 0
          },
          "deletions": {
            "type": "integer",
            "title": "Deletions",
            "default": 0
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "path",
          "operation"
        ],
        "title": "ChangedFile"
      },
      "ChapterExerciseSummary": {
        "properties": {
          "data_version": {
            "type": "string",
            "const": "3",
            "title": "Data Version",
            "default": "3"
          },
          "book_id": {
            "type": "string",
            "minLength": 1,
            "title": "Book Id"
          },
          "chapter_id": {
            "type": "string",
            "pattern": "^\\d+$",
            "title": "Chapter Id"
          },
          "exercise_ids": {
            "items": {
              "type": "string"
            },
            "type": "array",
            "minItems": 1,
            "title": "Exercise Ids"
          },
          "first_exercise": {
            "type": "string",
            "pattern": "^\\d+\\.\\d+$",
            "title": "First Exercise"
          },
          "last_exercise": {
            "type": "string",
            "pattern": "^\\d+\\.\\d+$",
            "title": "Last Exercise"
          },
          "exercise_count": {
            "type": "integer",
            "minimum": 1.0,
            "title": "Exercise Count"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "book_id",
          "chapter_id",
          "exercise_ids",
          "first_exercise",
          "last_exercise",
          "exercise_count"
        ],
        "title": "ChapterExerciseSummary"
      },
      "ContentWindow": {
        "properties": {
          "start_at": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/BoundaryAnchor"
              },
              {
                "type": "null"
              }
            ]
          },
          "end_before": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/BoundaryAnchor"
              },
              {
                "type": "null"
              }
            ]
          }
        },
        "additionalProperties": false,
        "type": "object",
        "title": "ContentWindow"
      },
      "ErrorDetail": {
        "properties": {
          "code": {
            "type": "string",
            "title": "Code"
          },
          "message": {
            "type": "string",
            "title": "Message"
          },
          "suggested_next_action": {
            "type": "string",
            "title": "Suggested Next Action"
          }
        },
        "type": "object",
        "required": [
          "code",
          "message",
          "suggested_next_action"
        ],
        "title": "ErrorDetail"
      },
      "EvidenceRequirement": {
        "properties": {
          "kind": {
            "type": "string",
            "enum": [
              "printed_page_equals",
              "contains_heading",
              "contains_figure",
              "contains_equation",
              "contains_example",
              "contains_table",
              "contains_text",
              "contains_exercise",
              "running_header_contains"
            ],
            "title": "Kind"
          },
          "value": {
            "type": "string",
            "minLength": 1,
            "title": "Value"
          },
          "verification_mode": {
            "type": "string",
            "enum": [
              "visual_required",
              "text_or_visual"
            ],
            "title": "Verification Mode"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "kind",
          "value",
          "verification_mode"
        ],
        "title": "EvidenceRequirement"
      },
      "ExerciseCatalogUnavailableResponse": {
        "properties": {
          "error_code": {
            "type": "string",
            "const": "EXERCISE_CATALOG_UNAVAILABLE",
            "title": "Error Code"
          },
          "detail": {
            "type": "string",
            "title": "Detail"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "error_code",
          "detail"
        ],
        "title": "ExerciseCatalogUnavailableResponse"
      },
      "ExerciseLocator": {
        "properties": {
          "data_version": {
            "type": "string",
            "const": "3",
            "title": "Data Version",
            "default": "3"
          },
          "book_id": {
            "type": "string",
            "minLength": 1,
            "title": "Book Id"
          },
          "exercise_id": {
            "type": "string",
            "pattern": "^\\d+\\.\\d+$",
            "title": "Exercise Id"
          },
          "chapter_id": {
            "type": "string",
            "pattern": "^\\d+$",
            "title": "Chapter Id"
          },
          "exercise_number": {
            "type": "integer",
            "minimum": 1.0,
            "title": "Exercise Number"
          },
          "starred": {
            "type": "boolean",
            "title": "Starred",
            "default": false
          },
          "source_order": {
            "type": "integer",
            "minimum": 1.0,
            "title": "Source Order"
          },
          "problem_page_range": {
            "$ref": "#/components/schemas/PageRange"
          },
          "problem_retrieval_plan": {
            "items": {
              "$ref": "#/components/schemas/PageRetrievalStep"
            },
            "type": "array",
            "minItems": 1,
            "title": "Problem Retrieval Plan"
          },
          "reference_retrieval_plan": {
            "items": {
              "$ref": "#/components/schemas/PageRetrievalStep"
            },
            "type": "array",
            "title": "Reference Retrieval Plan"
          },
          "reference_targets": {
            "items": {
              "$ref": "#/components/schemas/ExerciseReferenceTarget"
            },
            "type": "array",
            "title": "Reference Targets"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "book_id",
          "exercise_id",
          "chapter_id",
          "exercise_number",
          "source_order",
          "problem_page_range",
          "problem_retrieval_plan"
        ],
        "title": "ExerciseLocator"
      },
      "ExerciseNotFoundResponse": {
        "properties": {
          "error_code": {
            "type": "string",
            "const": "EXERCISE_NOT_FOUND",
            "title": "Error Code"
          },
          "detail": {
            "type": "string",
            "title": "Detail"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "error_code",
          "detail"
        ],
        "title": "ExerciseNotFoundResponse"
      },
      "ExerciseReferenceTarget": {
        "properties": {
          "kind": {
            "type": "string",
            "enum": [
              "section",
              "figure",
              "equation",
              "example",
              "table",
              "exercise"
            ],
            "title": "Kind"
          },
          "target_id": {
            "type": "string",
            "minLength": 1,
            "title": "Target Id"
          },
          "reason": {
            "type": "string",
            "minLength": 1,
            "title": "Reason"
          },
          "selected_context_pages": {
            "items": {
              "type": "string"
            },
            "type": "array",
            "title": "Selected Context Pages"
          },
          "retrieval_plan": {
            "items": {
              "$ref": "#/components/schemas/PageRetrievalStep"
            },
            "type": "array",
            "minItems": 1,
            "title": "Retrieval Plan"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "kind",
          "target_id",
          "reason",
          "retrieval_plan"
        ],
        "title": "ExerciseReferenceTarget"
      },
      "HTTPValidationError": {
        "properties": {
          "detail": {
            "items": {
              "$ref": "#/components/schemas/ValidationError"
            },
            "type": "array",
            "title": "Detail"
          }
        },
        "type": "object",
        "title": "HTTPValidationError"
      },
      "HeadingLocation": {
        "properties": {
          "page": {
            "$ref": "#/components/schemas/PageReference"
          },
          "bbox": {
            "items": {
              "type": "number"
            },
            "type": "array",
            "maxItems": 4,
            "minItems": 4,
            "title": "Bbox"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "page",
          "bbox"
        ],
        "title": "HeadingLocation"
      },
      "HealthResponse": {
        "properties": {
          "status": {
            "type": "string",
            "const": "ok",
            "title": "Status",
            "default": "ok"
          },
          "data_version": {
            "type": "string",
            "const": "3",
            "title": "Data Version",
            "default": "3"
          },
          "book_id": {
            "type": "string",
