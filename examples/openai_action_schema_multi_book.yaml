openapi: 3.1.0
info:
  title: Multi-Book Teaching GPT Backend
  version: 0.1.0
  description: Actions schema for a backend shared by multiple textbook GPTs.
servers:
  - url: https://YOUR-DOMAIN.example.com
security:
  - bearerAuth: []
paths:
  /books/{book_id}/toc:
    get:
      operationId: getTableOfContents
      summary: Get the table of contents for a book.
      parameters:
        - name: book_id
          in: path
          required: true
          schema:
            type: string
          description: Stable book id, such as dip4e.
      responses:
        '200':
          description: Table of contents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TocResponse'
        '404':
          description: Book not found.
  /books/{book_id}/sections/{section_id}:
    get:
      operationId: getSection
      summary: Get section pack by book id and section id. Supports explicit text windows for long sections.
      parameters:
        - name: book_id
          in: path
          required: true
          schema:
            type: string
          description: Stable book id, such as dip4e.
        - name: section_id
          in: path
          required: true
          schema:
            type: string
          description: Section id or alias, e.g. 2.4.4.
        - name: text_offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Character offset into section text_blocks for continuing a long section.
        - name: text_limit
          in: query
          required: false
          schema:
            type: integer
            default: 12000
            minimum: 1
            maximum: 50000
          description: Maximum section text characters to return. Use content.next_offset to continue.
      responses:
        '200':
          description: Section pack including text, figures, equations, examples, pages, and context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionPack'
        '404':
          description: Book or section not found.
  /books/{book_id}/search:
    get:
      operationId: searchBook
      summary: Search concepts, headings, or keywords in a book.
      parameters:
        - name: book_id
          in: path
          required: true
          schema:
            type: string
          description: Stable book id, such as dip4e.
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: User query, such as 图像插值 or image interpolation.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 8
            minimum: 1
            maximum: 20
      responses:
        '200':
          description: Search results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '404':
          description: Book not found.
  /books/{book_id}/figures/{figure_id}:
    get:
      operationId: getFigure
      summary: Get figure by id.
      parameters:
        - name: book_id
          in: path
          required: true
          schema:
            type: string
          description: Stable book id, such as dip4e.
        - name: figure_id
          in: path
          required: true
          schema:
            type: string
          description: Figure id, e.g. 2.27.
      responses:
        '200':
          description: Figure metadata, caption, related sections, and image/page URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FigureResponse'
        '404':
          description: Book or figure not found.
  /books/{book_id}/sections/{section_id}/prerequisites:
    get:
      operationId: getPrerequisites
      summary: Get prerequisite sections.
      parameters:
        - name: book_id
          in: path
          required: true
          schema:
            type: string
          description: Stable book id, such as dip4e.
        - name: section_id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 5
            minimum: 1
            maximum: 10
      responses:
        '200':
          description: Prerequisite section list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrerequisitesResponse'
        '404':
          description: Book not found.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    TocResponse:
      type: object
      properties:
        book_id:
          type: string
        title:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/TocItem'
    TocItem:
      type: object
      properties:
        section_id:
          type: string
        title:
          type: string
        level:
          type: integer
        page_start:
          type: integer
          nullable: true
        page_end:
          type: integer
          nullable: true
    SectionPack:
      type: object
      properties:
        book_id:
          type: string
        section_id:
          type: string
        resolved_section_id:
          type: string
          nullable: true
        parent_section_id:
          type: string
          nullable: true
        title:
          type: string
        page_start:
          type: integer
          nullable: true
        page_end:
          type: integer
          nullable: true
        section_type:
          type: string
        summary:
          type: string
          nullable: true
        text_blocks:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              text:
                type: string
              page_number:
                type: integer
                nullable: true
        content:
          $ref: '#/components/schemas/SectionContentMeta'
        figures:
          type: array
          items:
            $ref: '#/components/schemas/FigureRef'
        equations:
          type: array
          items:
            type: object
        examples:
          type: array
          items:
            type: object
        source_pages:
          type: array
          items:
            type: object
            properties:
              page_index:
                type: integer
              page_number:
                type: integer
              image_url:
                type: string
                nullable: true
        previous_sections:
          type: array
          items:
            type: string
        next_sections:
          type: array
          items:
            type: string
        prerequisites:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
    SectionContentMeta:
      type: object
      properties:
        content_status:
          type: string
          enum: [complete, partial]
        is_truncated:
          type: boolean
        text_offset:
          type: integer
          minimum: 0
        text_limit:
          type: integer
          nullable: true
          minimum: 1
        total_chars:
          type: integer
          minimum: 0
        returned_chars:
          type: integer
          minimum: 0
        next_offset:
          type: integer
          nullable: true
          minimum: 0
    FigureRef:
      type: object
      properties:
        figure_id:
          type: string
        label:
          type: string
          nullable: true
        caption:
          type: string
          nullable: true
        page_index:
          type: integer
          nullable: true
        page_number:
          type: integer
          nullable: true
        image_url:
          type: string
          nullable: true
        page_image_url:
          type: string
          nullable: true
        context:
          type: string
          nullable: true
    FigureResponse:
      allOf:
        - $ref: '#/components/schemas/FigureRef'
        - type: object
          properties:
            book_id:
              type: string
            related_section_ids:
              type: array
              items:
                type: string
    SearchResponse:
      type: object
      properties:
        book_id:
          type: string
        query:
          type: string
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
    SearchResult:
      type: object
      properties:
        section_id:
          type: string
        title:
          type: string
        page_start:
          type: integer
          nullable: true
        page_end:
          type: integer
          nullable: true
        score:
          type: number
        snippet:
          type: string
          nullable: true
    PrerequisitesResponse:
      type: object
      properties:
        book_id:
          type: string
        section_id:
          type: string
        prerequisites:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
